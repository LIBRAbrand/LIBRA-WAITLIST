<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Libra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
:root{
--bg:#000000;
--fg:#f2f1ec;
--muted:#8b8b86;
--accent:#f2f1ec;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:#000000;}
body{
background:var(--bg);
color:var(--fg);
font-family:'Helvetica Neue', Arial, sans-serif;
display:flex;
align-items:center;
justify-content:center;
min-height:100vh;
position:relative;
overflow:hidden;
padding:24px;
}

/* grain texture overlay (whole page) */
body::before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
opacity:0.35;
mix-blend-mode:overlay;
background-image:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIj48ZmlsdGVyIGlkPSJuIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iMC44NSIgbnVtT2N0YXZlcz0iMyIgc3RpdGNoVGlsZXM9InN0aXRjaCIvPjwvZmlsdGVyPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbHRlcj0idXJsKCNuKSIgb3BhY2l0eT0iMC45Ii8+PC9zdmc+");
background-repeat:repeat;
z-index:5;
}

.vignette{
position:fixed;
inset:0;
pointer-events:none;
background:radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,0.75) 100%);
z-index:4;
}

.container{
position:relative;
z-index:2;
width:100%;
max-width:380px;
text-align:center;
}

/* --- Countdown (sous le logo) --- */
.cd-wrap{
width:min(92vw,560px);
position:relative;
left:50%;
transform:translateX(-50%);
text-align:center;
margin-bottom:40px;
}
.cd-title{
font-family:'Anton',sans-serif;
font-size:clamp(12px,3.4vw,16px);
letter-spacing:.35em;
text-transform:uppercase;
color:var(--fg);
margin-bottom:12px;
padding-left:.35em; /* compense le letter-spacing pour centrer */
}
#countdown{
display:flex;
justify-content:center;
gap:clamp(10px,3vw,20px);
color:var(--fg);
}
#countdown.open{
font-family:'Anton',sans-serif;
font-size:clamp(24px,7vw,40px);
letter-spacing:2px;
text-transform:uppercase;
line-height:1.1;
}
.cd-box{
display:flex;
flex-direction:column;
align-items:center;
min-width:clamp(48px,13vw,64px);
}
.cd-box span{
font-family:'Anton',sans-serif;
font-size:clamp(30px,8vw,46px);
line-height:1;
letter-spacing:2px;
text-transform:uppercase;
}
.cd-box small{
margin-top:6px;
font-size:9px;
letter-spacing:.25em;
text-transform:uppercase;
opacity:.55;
}

/* --- Logo (image) : tout en haut de la page, centré --- */
.logo-wrap{
position:fixed;
top:max(24px, env(safe-area-inset-top));
left:0;
right:0;
z-index:6;
text-align:center;
pointer-events:none;
}
.logo-img{
display:block;
width:120px;
max-width:40%;
height:auto;
margin:0 auto;
}

/* --- Password gate --- */
#gate-view{ }
.gate-row{
display:flex;
border-bottom:1px solid rgba(242,241,236,0.35);
align-items:center;
}
.gate-row input{
flex:1;
background:transparent;
border:none;
outline:none;
color:var(--fg);
font-size:14px;
letter-spacing:1px;
padding:14px 4px;
font-family:inherit;
}
.gate-row input::placeholder{
color:var(--muted);
text-transform:uppercase;
letter-spacing:1px;
font-size:13px;
}
.enter-btn{
background:var(--fg);
color:#000;
border:none;
padding:14px 20px;
font-size:12px;
font-weight:700;
letter-spacing:1px;
text-transform:uppercase;
cursor:pointer;
white-space:nowrap;
}
.enter-btn:hover{ opacity:0.85; }

.gate-error{
color:#e2534d;
font-size:12px;
letter-spacing:0.5px;
margin-top:12px;
min-height:14px;
}

.join-link{
display:inline-block;
margin-top:36px;
font-size:13px;
letter-spacing:1px;
text-transform:uppercase;
color:var(--muted);
text-decoration:none;
border-bottom:1px solid transparent;
transition:border-color 0.2s;
}
.join-link:hover{ color:var(--fg); border-color:var(--fg); }

/* --- Waitlist form --- */
#waitlist-view{ display:none; }

.field{
border-bottom:1px solid rgba(242,241,236,0.35);
margin-bottom:26px;
text-align:left;
}
.field label{
display:block;
font-size:11px;
letter-spacing:1px;
text-transform:uppercase;
color:var(--muted);
margin-bottom:6px;
}
.field input{
width:100%;
background:transparent;
border:none;
outline:none;
color:var(--fg);
font-size:15px;
padding-bottom:10px;
font-family:inherit;
}

/* Nom / Prénom cote à cote */
.field-row{
display:flex;
gap:16px;
border-bottom:1px solid rgba(242,241,236,0.35);
margin-bottom:26px;
text-align:left;
}
.field-row .sub-field{
flex:1;
}
.field-row .sub-field:first-child{
border-right:1px solid rgba(242,241,236,0.2);
padding-right:16px;
}
.field-row label{
display:block;
font-size:11px;
letter-spacing:1px;
text-transform:uppercase;
color:var(--muted);
margin-bottom:6px;
}
.field-row input{
width:100%;
background:transparent;
border:none;
outline:none;
color:var(--fg);
font-size:15px;
padding-bottom:10px;
font-family:inherit;
}

.optional-tag{
color:var(--muted);
font-weight:400;
text-transform:none;
letter-spacing:0;
}

.submit-btn{
width:100%;
background:transparent;
border:1px solid var(--fg);
color:var(--fg);
padding:16px;
font-size:12px;
font-weight:700;
letter-spacing:2px;
text-transform:uppercase;
cursor:pointer;
margin-top:12px;
transition:background 0.2s, color 0.2s;
}
.submit-btn:hover{ background:var(--fg); color:#000; }
.submit-btn:disabled{ opacity:0.5; cursor:default; }

.back-link{
display:inline-block;
margin-top:24px;
font-size:11px;
letter-spacing:1px;
text-transform:uppercase;
color:var(--muted);
text-decoration:none;
}
.back-link:hover{ color:var(--fg); }

.form-msg{
font-size:12px;
letter-spacing:0.5px;
margin-top:16px;
min-height:14px;
}
.form-msg.success{ color:#8fd19e; }
.form-msg.error{ color:#e2534d; }

#success-view{
display:none;
text-align:center;
}
#success-view p{
color:var(--muted);
font-size:13px;
letter-spacing:0.5px;
line-height:1.6;
margin-top:16px;
}
</style>
</head>

<div class="container">

<!-- COUNTDOWN -->
<div class="cd-wrap">
<div class="cd-title">THE BLACK DROP :</div>
<div id="countdown">
<div class="cd-box"><span id="d">00</span><small>Jours</small></div>
<div class="cd-box"><span id="h">00</span><small>Heures</small></div>
<div class="cd-box"><span id="m">00</span><small>Min</small></div>
<div class="cd-box"><span id="s">00</span><small>Sec</small></div>
</div>
</div>

<!-- GATE -->
<div id="gate-view">
<div class="gate-row">
<input type="password" id="passwordInput" placeholder="Password" autocomplete="off">
<button class="enter-btn" id="enterBtn">Enter</button>
</div>
<div class="gate-error" id="gateError"></div>

<a href="#" class="join-link" id="joinLink">Join waitlist</a>
</div>

<!-- WAITLIST FORM -->
<div id="waitlist-view">
<form id="waitlistForm">

<div class="field">
<label for="firstName">First name</label>
<input type="text" id="firstName" name="firstName" required>
</div>

<div class="field">
<label for="phone">Phone number</label>
<input type="tel" id="phone" name="phone" required>
</div>

<button type="submit" class="submit-btn" id="submitBtn">Submit</button>
<div class="form-msg" id="formMsg"></div>
</form>

<a href="#" class="back-link" id="backLink">← Back</a>
</div>

<!-- SUCCESS -->
<div id="success-view">
<p id="successMsg">You're on the list. We'll be in touch.</p>
<a href="#" class="back-link" id="backLink2">← Back</a>
</div>
</div>

<script>
// ====== CONFIG ======
// Mot de passe d'accès (change-le ici)
const SITE_PASSWORD = "libra2026";

// URL de ton Google Apps Script (les inscriptions arrivent dans ta Google Sheet)
const SHEET_URL = "https://script.google.com/macros/s/AKfycbwk68wpQFyMElp3Kg_KujcJ3zaJderp3ZnGetZNBalYmBWnkpHGKb3B891soOBXzaI/exec";
// =====================

const gateView = document.getElementById('gate-view');
const waitlistView = document.getElementById('waitlist-view');
const successView = document.getElementById('success-view');

const passwordInput = document.getElementById('passwordInput');
const enterBtn = document.getElementById('enterBtn');
const gateError = document.getElementById('gateError');

function showView(view){
gateView.style.display = 'none';
waitlistView.style.display = 'none';
successView.style.display = 'none';
view.style.display = 'block';
}

function checkPassword(){
if(passwordInput.value.trim().toLowerCase() === SITE_PASSWORD.toLowerCase()){
gateError.style.color = '#8fd19e';
gateError.textContent = 'Access granted.';
// Redirige vers le site principal ici si besoin :
// window.location.href = "home.html";
} else {
gateError.style.color = '#e2534d';
gateError.textContent = 'Incorrect password.';
}
}

enterBtn.addEventListener('click', checkPassword);
passwordInput.addEventListener('keydown', (e) => {
if(e.key === 'Enter') checkPassword();
});

document.getElementById('joinLink').addEventListener('click', (e) => {
e.preventDefault();
showView(waitlistView);
});
document.getElementById('backLink').addEventListener('click', (e) => {
e.preventDefault();
showView(gateView);
});
document.getElementById('backLink2').addEventListener('click', (e) => {
e.preventDefault();
showView(gateView);
});

const form = document.getElementById('waitlistForm');
const submitBtn = document.getElementById('submitBtn');
const formMsg = document.getElementById('formMsg');

form.addEventListener('submit', async (e) => {
e.preventDefault();
formMsg.className = 'form-msg';
formMsg.textContent = '';
submitBtn.disabled = true;
submitBtn.textContent = 'Submitting...';

const data = {
firstName: document.getElementById('firstName').value,
phone: document.getElementById('phone').value
};

try{
await fetch(SHEET_URL, {
method: 'POST',
mode: 'no-cors',
body: new URLSearchParams(data)
});
form.reset();
submitBtn.disabled = false;
submitBtn.textContent = 'Submit';
showView(successView);
} catch(err){
submitBtn.disabled = false;
submitBtn.textContent = 'Submit';
formMsg.classList.add('error');
formMsg.textContent = 'Something went wrong. Please try again.';
}
});

// ====== COUNTDOWN : THE BLACK DROP ======
// 24 octobre 2026 à 20h (heure du Maroc, UTC+1)
const target = new Date("2026-10-24T20:00:00+01:00");
const pad = n => String(n).padStart(2, "0");

function tick() {
const diff = target - new Date();
const box = document.getElementById("countdown");
if (diff <= 0) {
box.classList.add("open");
box.textContent = "Le drop est ouvert !";
clearInterval(timer);
return;
}
document.getElementById("d").textContent = pad(Math.floor(diff / 86400000));
document.getElementById("h").textContent = pad(Math.floor(diff / 3600000) % 24);
document.getElementById("m").textContent = pad(Math.floor(diff / 60000) % 60);
document.getElementById("s").textContent = pad(Math.floor(diff / 1000) % 60);
}
const timer = setInterval(tick, 1000);
tick();
</script>
